                                <div class="menu-item trash">

                                </div>

                                <div class="menu-item copy">
                                    <i class="fi fi-sr-copy-alt"></i>
                                </div>
                            </div>
                            <div class="main-icon-container">
                                <div class="icon">
                                    <i class="fi fi-sr-apps"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="canvas-container">
                    <svg class="bezier-svg" preserveAspectRatio="none">
                        <!-- Gradient definitions will go here -->
                        <defs>
                            <linearGradient id="bezier-gradient-0" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#353535" />
                                <stop offset="100%" stop-color="#353535" />
                            </linearGradient>
                        </defs>
                        
                        <!-- Path for the area under the curve -->
                        <path class="bezier-area" fill="url(#bezier-gradient-0)" fill-opacity="0.2" />
                        
                        <!-- Path for the curve itself -->
                        <path class="bezier-curve" stroke="url(#bezier-gradient-0)" stroke-width="3" fill="none" />
                        
                        <!-- Circles for the start and end points -->
                        <circle class="start-point" fill="#353535" />
                        <circle class="end-point" fill="#353535" />
                    </svg>
                </div>
